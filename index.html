<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101419"><meta name="description" content="Private finance tracker for Andril Stories">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Andril Finance</title>
<style>
:root{--bg:#101419;--panel:#1b222a;--panel2:#202830;--line:#303943;--gold:#b9a47a;--gold2:#d0bd91;--text:#f0f1f2;--muted:#9aa2aa;--green:#81c6a0;--red:#e28d91}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:22px 18px 12px;position:sticky;top:0;background:#101419f2;backdrop-filter:blur(14px);z-index:4;border-bottom:1px solid #202830}
.brand{font-size:11px;letter-spacing:4px;color:var(--gold);font-weight:700}.top{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.top h1{font-size:29px;margin:0;font-weight:650}.btn{border:0;border-radius:16px;padding:13px 16px;background:var(--panel2);color:var(--text);font-weight:650;font-size:14px;cursor:pointer}.btn.gold{background:var(--gold);color:#171717}.btn.small{padding:9px 12px;border-radius:12px;font-size:12px}.btn.danger{background:#40272b;color:#f3b1b3}
nav{display:flex;gap:8px;overflow:auto;padding:16px 18px 4px;scrollbar-width:none}nav button{white-space:nowrap}.tab{background:var(--panel);color:#aeb5bc}.tab.active{background:var(--gold);color:#171717}
main{padding:22px 18px 90px;max-width:760px;margin:auto}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 18px}.section-head h2{font-size:22px;margin:0}.select{background:transparent;color:var(--text);border:1px solid var(--line);padding:12px;border-radius:13px}
.card{background:linear-gradient(145deg,#202830,#1a2027);border:1px solid var(--line);border-radius:24px;padding:22px;margin:14px 0}.hero{padding:26px}.hero .amount{font-size:38px;font-weight:750;margin:14px 0}.muted{color:var(--muted)}.stats{display:flex;gap:30px;flex-wrap:wrap}.stats b{display:block;font-size:18px;margin-top:5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.mini strong{display:block;font-size:23px;margin-top:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 24px}.list{display:grid;gap:10px}.item{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item small{display:block;color:var(--muted);margin-top:5px}.pos{color:var(--green)}.neg{color:var(--red)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin:8px 0}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#12181e;color:var(--text);font:inherit;min-width:0}textarea{min-height:75px;resize:vertical}.field select{appearance:auto}.hidden{display:none!important}.notice{padding:13px;border-radius:13px;background:#252a2f;color:#d2c7ac;font-size:13px;line-height:1.5;margin:12px 0}.pill{font-size:11px;border-radius:30px;padding:5px 9px;background:#2b333c;color:#c7cdd2}.balance{font-weight:700;color:var(--gold2)}.modal{position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#171e25;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 18px 34px}.sheet h3{margin:0 0 15px}.sheethead{display:flex;justify-content:space-between;align-items:center}.empty{text-align:center;padding:35px 12px;color:var(--muted)}.bar{height:9px;background:#343c44;border-radius:20px;overflow:hidden;margin-top:12px}.bar span{display:block;height:100%;background:var(--gold);width:0}.foot{color:var(--muted);font-size:11px;text-align:center;padding:25px 0}
@media(min-width:650px){main{padding-top:28px}.modal{align-items:center}.sheet{border-radius:24px}.hero .amount{font-size:44px}}
</style>
</head>
<body>
<header><div class="brand">A N D R I L &nbsp; S T O R I E S</div><div class="top"><h1>Finance.</h1><button class="btn" id="lockBtn">Lock</button></div></header>
<nav id="nav">
<button class="btn tab active" data-page="overview">Overview</button><button class="btn tab" data-page="activity">Activity</button><button class="btn tab" data-page="projects">Projects</button><button class="btn tab" data-page="freelance">Freelance</button><button class="btn tab" data-page="rentals">Rentals</button><button class="btn tab" data-page="reports">Reports</button><button class="btn tab" data-page="privacy">Privacy & backup</button>
</nav>
<main id="app"></main>
<div id="modal" class="modal hidden"><div class="sheet"><div class="sheethead"><h3 id="modalTitle">Add</h3><button class="btn small" id="closeModal">Close</button></div><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s), money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}), today=()=>new Date().toISOString().slice(0,10), uid=()=>crypto.randomUUID();
const STORE='andril_finance_v3', CFG='andril_finance_cfg';
let db={transactions:[],projects:[],rentals:[]}, page='overview', period='month', session=null, supa=null, cfg=JSON.parse(localStorage.getItem(CFG)||'{}'), locked=false;
const incomeCats=['Wedding payment','Freelance payment','Album design','Printing / frames','Other income'];
const expenseCats=['Rental','Travel','Fuel','Food','Employee payment','Assistant payment','Equipment','Studio rent','Salary','Internet / software','Marketing','Printing','Freelance expense','Other expense'];
const load=()=>{try{db=JSON.parse(localStorage.getItem(STORE))||db}catch{}};
const save=()=>localStorage.setItem(STORE,JSON.stringify(db));
const sum=(arr)=>arr.reduce((a,x)=>a+Number(x.amount||0),0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthKey=d=>(d||'').slice(0,7);
function inPeriod(x){const d=x.date||'';if(period==='all')return true;if(period==='month')return monthKey(d)===today().slice(0,7);if(period==='year')return d.slice(0,4)===today().slice(0,4);return d===today()}
function totals(){let t=db.transactions.filter(inPeriod), inc=sum(t.filter(x=>x.type==='income')), exp=sum(t.filter(x=>x.type==='expense'));return {inc,exp,net:inc-exp,t}}
function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
$('#closeModal').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function field(label,name,type='text',value='',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,name,opts,selected=''){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>`<option ${o===selected?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function addTransaction(type,defaults={}){let cats=type==='income'?incomeCats:expenseCats;modal(type==='income'?'Add income':'Add expense',`<form id="txForm"><div class="formgrid">
${field('Date','date','date',defaults.date||today(), 'required')}
${field('Amount (₹)','amount','number',defaults.amount||'', 'min="0.01" step="0.01" required')}
${selectField('Category','category',cats,defaults.category||cats[0])}
${selectField('Account','account',['Business','Personal'])}
${field(type==='income'?'Client / source':'Paid to / vendor','party','text',defaults.party||'')}
${field('Linked project (optional)','project','text',defaults.project||'','list="projectNames"')}
<div class="field full"><label>Note</label><textarea name="note">${esc(defaults.note||'')}</textarea></div>
</div><datalist id="projectNames">${db.projects.map(p=>`<option value="${esc(p.couple)}">`).join('')}</datalist><button class="btn gold" type="submit">Save ${type}</button></form>`);
$('#txForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),x=Object.fromEntries(f);x.id=uid();x.type=type;x.amount=Number(x.amount);x.projectId=db.projects.find(p=>p.couple===x.project)?.id||'';db.transactions.push(x);save();closeModal();render();syncSoon()};
}
function projectForm(p={}){modal(p.id?'Edit project':'New wedding project',`<form id="projectForm"><div class="formgrid">
${field('Couple name','couple','text',p.couple||'','required')}
${field('Wedding date','date','date',p.date||today(),'required')}
${field('Package / agreed amount (₹)','total','number',p.total||'','min="0" step="0.01" required')}
${field('Advance received (₹)','advance','number',p.advance||0,'min="0" step="0.01"')}
${field('Additional paid amount (₹)','paid','number',p.paid||0,'min="0" step="0.01"')}
${field('Venue / location','venue','text',p.venue||'')}
${field('Contact','contact','text',p.contact||'')}
<div class="field full"><label>Project notes</label><textarea name="notes">${esc(p.notes||'')}</textarea></div></div><button class="btn gold">Save project</button></form>`);
$('#projectForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let item={...p,...f,id:p.id||uid(),total:+f.total,advance:+f.advance,paid:+f.paid};if(p.id)db.projects=db.projects.map(x=>x.id===p.id?item:x);else {db.projects.push(item);[['Advance received',item.advance],['Additional paid amount',item.paid]].forEach(([label,amt])=>{if(amt>0)db.transactions.push({id:uid(),type:'income',date:item.date,amount:amt,category:'Wedding payment',party:item.couple,note:label,project:item.couple,projectId:item.id,account:'Business'})})}save();closeModal();render();syncSoon()};
}
function addProjectCost(p,kind){addTransaction('expense',{project:p.couple,category:kind==='crew'?'Employee payment':kind==='assistant'?'Assistant payment':kind==='rental'?'Rental':'Travel',note:'Project cost: '+p.couple})}
function projectPdf(p){const {jsPDF}=window.jspdf,doc=new jsPDF();let rows=db.transactions.filter(t=>t.projectId===p.id||t.project===p.couple);let received=rows.filter(t=>t.type==='income').reduce((a,x)=>a+x.amount,0),cost=rows.filter(t=>t.type==='expense').reduce((a,x)=>a+x.amount,0);let balance=Math.max(0,p.total-received);doc.setFontSize(18);doc.text('ANDRIL STORIES — PROJECT STATEMENT',14,18);doc.setFontSize(11);doc.text('Couple: '+p.couple,14,30);doc.text('Wedding date: '+p.date,14,38);doc.text('Agreed package: '+money(p.total),14,46);doc.text('Received: '+money(received),14,54);doc.text('Pending: '+money(balance),14,62);doc.text('Project expenses: '+money(cost),14,70);doc.text('Net project position (received - expenses): '+money(received-cost),14,78);let y=92;doc.text('Date       Type       Category / details                         Amount',14,y);y+=8;rows.forEach(t=>{if(y>275){doc.addPage();y=18}doc.text(`${t.date}   ${t.type}   ${(t.category||'').slice(0,22)} ${(t.party||t.note||'').slice(0,28)}   ${money(t.amount)}`,14,y);y+=7});doc.save('Andril-'+p.couple.replace(/[^a-z0-9]+/gi,'-')+'-statement.pdf')}
function renderOverview(){let t=totals(),pending=db.projects.reduce((a,p)=>a+Math.max(0,p.total-projectReceived(p)),0),recent=[...t.t].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `<div class="eyebrow">YOUR FINANCES</div><div class="section-head"><h2>Overview</h2><select class="select" id="period"><option value="month">This month</option><option value="today">Today</option><option value="year">This year</option><option value="all">All time</option></select></div>
<div class="card hero"><div class="eyebrow">NET CASH FLOW</div><div class="amount">${money(t.net)}</div><div class="stats"><div><span class="muted">Income received</span><b class="pos">${money(t.inc)}</b></div><div><span class="muted">Expenses paid</span><b class="neg">${money(t.exp)}</b></div></div></div>
<div class="grid2"><div class="mini"><span class="muted">Pending from clients</span><strong>${money(pending)}</strong></div><div class="mini"><span class="muted">Active projects</span><strong>${db.projects.length}</strong></div></div>
<h3>Quick entry</h3><div class="actions"><button class="btn gold" id="quickIncome">＋ Income</button><button class="btn" id="quickExpense">− Expense</button><button class="btn" id="quickProject">＋ Project</button></div>
<h3>Recent activity</h3><div class="list">${recent.length?recent.map(t=>activityItem(t)).join(''):'<div class="empty">No entries for this period yet.</div>'}</div>`}
function projectReceived(p){return db.transactions.filter(t=>t.type==='income'&&(t.projectId===p.id||t.project===p.couple)).reduce((a,x)=>a+x.amount,0)}
function activityItem(t){return `<div class="item"><div><b>${esc(t.party||t.category||'Entry')}</b><small>${esc(t.date)} · ${esc(t.category)} · ${esc(t.account||'Business')}</small></div><b class="${t.type==='income'?'pos':'neg'}">${t.type==='income'?'+':'−'}${money(t.amount)}</b></div>`}
function renderActivity(){let all=[...db.transactions].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="section-head"><h2>Activity</h2><button class="btn small gold" id="newIncome">＋ Add</button></div><div class="actions"><button class="btn gold" id="actIncome">＋ Income</button><button class="btn" id="actExpense">− Expense</button></div><div class="list">${all.length?all.map(activityItem).join(''):'<div class="empty">Your income and expenses will appear here.</div>'}</div>`}
function renderProjects(){return `<div class="section-head"><h2>Wedding projects</h2><button class="btn gold small" id="newProject">＋ Project</button></div><div class="list">${db.projects.length?db.projects.map(p=>{let received=projectReceived(p),bal=Math.max(0,p.total-received),cost=db.transactions.filter(t=>t.type==='expense'&&(t.projectId===p.id||t.project===p.couple)).reduce((a,x)=>a+x.amount,0);return `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(p.couple)}</b><small class="muted">${esc(p.date)} · ${esc(p.venue||'Wedding')}</small></div><span class="pill">${bal>0?'Payment pending':'Paid'}</span></div><div class="grid2" style="margin-top:18px"><div><small class="muted">Package</small><b>${money(p.total)}</b></div><div><small class="muted">Advance</small><b>${money(p.advance)}</b></div><div><small class="muted">Received</small><b class="pos">${money(received)}</b></div><div><small class="muted">Balance</small><b class="balance">${money(bal)}</b></div><div><small class="muted">Project costs</small><b class="neg">${money(cost)}</b></div></div><div class="bar"><span style="width:${p.total?Math.min(100,received/p.total*100):0}%"></span></div><div class="actions"><button class="btn small gold" data-pay="${p.id}">＋ Payment</button><button class="btn small" data-cost="${p.id}">＋ Cost</button><button class="btn small" data-edit="${p.id}">Edit</button><button class="btn small" data-pdf="${p.id}">PDF</button></div></div>`}).join(''):'<div class="empty">Add your first wedding project.</div>'}</div>`}
function renderFreelance(){let arr=db.transactions.filter(t=>t.category==='Freelance payment'||t.category==='Freelance expense');return `<div class="section-head"><h2>Freelance</h2><button class="btn gold small" id="freelanceIncome">＋ Income</button></div><div class="notice">Freelance work is tracked separately from wedding projects. Use “Freelance payment” for money received and “Freelance expense” for costs.</div><button class="btn" id="freelanceExpense">− Freelance expense</button><div class="list" style="margin-top:15px">${arr.length?arr.map(activityItem).join(''):'<div class="empty">No freelance entries yet.</div>'}</div>`}
function renderRentals(){return `<div class="section-head"><h2>Rental register</h2><button class="btn gold small" id="newRental">＋ Rental</button></div><div class="list">${db.rentals.length?db.rentals.map(r=>`<div class="item"><div><b>${esc(r.item)}</b><small>${esc(r.vendor)} · ${esc(r.from)} to ${esc(r.to)} · ${esc(r.project||'General')}</small><small>${r.returned?'Returned':'Return pending'}</small></div><div><b class="neg">${money(r.amount)}</b><small>${esc(r.status)}</small></div></div>`).join(''):'<div class="empty">Track camera, lens, lighting, and other equipment rentals here.</div>'}</div>`}
function rentalForm(){modal('Add rental',`<form id="rentalForm"><div class="formgrid">${field('Equipment / item','item')}${field('Rental vendor','vendor')}${field('Start date','from','date',today())}${field('Return date','to','date',today())}${field('Rental amount (₹)','amount','number','','min="0" step="0.01"')}${field('Project / couple','project')}${selectField('Payment status','status',['Paid','Pending'])}${selectField('Returned?','returned',['No','Yes'])}</div><button class="btn gold">Save rental</button></form>`);$('#rentalForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.id=uid();f.amount=+f.amount;f.returned=f.returned==='Yes';db.rentals.push(f);if(f.status==='Paid')db.transactions.push({id:uid(),type:'expense',date:f.from,amount:f.amount,category:'Rental',party:f.vendor,note:f.item+' rental',project:f.project,projectId:db.projects.find(p=>p.couple===f.project)?.id||'',account:'Business'});save();closeModal();render();syncSoon()}}
function renderReports(){let inc=sum(db.transactions.filter(t=>t.type==='income')),exp=sum(db.transactions.filter(t=>t.type==='expense')),p=db.projects.reduce((a,x)=>a+Math.max(0,x.total-projectReceived(x)),0);let byCat={};db.transactions.filter(t=>t.type==='expense').forEach(t=>byCat[t.category]=(byCat[t.category]||0)+t.amount);return `<h2>Financial reports</h2><div class="grid2"><div class="mini"><span class="muted">Total income received</span><strong class="pos">${money(inc)}</strong></div><div class="mini"><span class="muted">Total expenses</span><strong class="neg">${money(exp)}</strong></div><div class="mini"><span class="muted">Net cash</span><strong>${money(inc-exp)}</strong></div><div class="mini"><span class="muted">Pending client balance</span><strong>${money(p)}</strong></div></div><h3>Expenses by category</h3><div class="list">${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="item"><b>${esc(k)}</b><b class="neg">${money(v)}</b></div>`).join('')||'<div class="empty">No expenses yet.</div>'}</div><div class="actions"><button class="btn gold" id="reportPdf">Download overall PDF</button><button class="btn" id="csvExport">Export CSV</button></div>`}
function renderPrivacy(){return `<h2>Privacy & backup</h2><div class="notice">Your data is stored on this device until you connect a private Supabase project. Cloud sign-in is optional until configured. Do not publish your Supabase service-role key.</div><h3>Account & cloud sync</h3><div class="card"><div class="field"><label>Supabase project URL</label><input id="sbUrl" placeholder="https://xxxx.supabase.co" value="${esc(cfg.url||'')}"></div><div class="field"><label>Supabase publishable / anon key</label><input id="sbKey" placeholder="Paste publishable key" value="${esc(cfg.key||'')}"></div><button class="btn gold" id="saveCloud">Save connection</button><div class="actions"><button class="btn" id="googleLogin">Continue with Google</button><button class="btn" id="emailLogin">Email sign in</button><button class="btn" id="signOut">Sign out</button></div><small class="muted">${session?'Signed in: '+esc(session.user.email):'Not signed in'}</small><div class="notice">Google sign-in requires Google OAuth setup in Supabase. Email sign-in also works. After first registration, disable public sign-ups in Supabase if this account is for your personal use only.</div></div><h3>Backup</h3><div class="actions"><button class="btn gold" id="backup">Download JSON backup</button><button class="btn" id="restore">Restore backup</button><input type="file" id="restoreFile" accept=".json" class="hidden"></div><button class="btn danger" id="wipe">Delete all local data</button><div class="foot">Andril Finance · Personal use · No ads or analytics</div>`}
function render(){if(locked){$('#app').innerHTML=`<div class="card"><h2>App locked</h2><p class="muted">Unlock this app session to continue.</p><button class="btn gold" id="unlock">Unlock</button></div>`;$('#unlock').onclick=()=>{locked=false;render()};return}
let html=page==='overview'?renderOverview():page==='activity'?renderActivity():page==='projects'?renderProjects():page==='freelance'?renderFreelance():page==='rentals'?renderRentals():page==='reports'?renderReports():renderPrivacy();$('#app').innerHTML=html;
$('#nav').querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
const bind=(id,fn)=>{let el=$(id);if(el)el.onclick=fn};
bind('#period',e=>{period=e.target.value;render()});
bind('#quickIncome',()=>addTransaction('income'));bind('#quickExpense',()=>addTransaction('expense'));bind('#quickProject',()=>projectForm());
bind('#actIncome',()=>addTransaction('income'));bind('#actExpense',()=>addTransaction('expense'));bind('#newIncome',()=>addTransaction('income'));bind('#newProject',()=>projectForm());bind('#newRental',rentalForm);
bind('#freelanceIncome',()=>addTransaction('income',{category:'Freelance payment'}));bind('#freelanceExpense',()=>{addTransaction('expense',{category:'Freelance expense'});});
document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{let p=db.projects.find(x=>x.id===b.dataset.pay);addTransaction('income',{party:p.couple,project:p.couple,category:'Wedding payment'})});
document.querySelectorAll('[data-cost]').forEach(b=>b.onclick=()=>{let p=db.projects.find(x=>x.id===b.dataset.cost);addProjectCost(p,'cost')});
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>projectForm(db.projects.find(x=>x.id===b.dataset.edit)));
document.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>projectPdf(db.projects.find(x=>x.id===b.dataset.pdf)));
bind('#reportPdf',overallPdf);bind('#csvExport',csvExport);
bind('#saveCloud',saveCloud);bind('#googleLogin',googleLogin);bind('#emailLogin',emailLogin);bind('#signOut',signOut);bind('#backup',backup);bind('#restore',()=>$('#restoreFile').click());bind('#wipe',wipe);
let rf=$('#restoreFile');if(rf)rf.onchange=restore;
}
$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}};
$('#lockBtn').onclick=()=>{locked=true;render()};
function overallPdf(){const {jsPDF}=window.jspdf,doc=new jsPDF();let t=sum(db.transactions.filter(x=>x.type==='income')),e=sum(db.transactions.filter(x=>x.type==='expense'));doc.setFontSize(18);doc.text('ANDRIL STORIES — FINANCIAL SUMMARY',14,18);doc.setFontSize(11);doc.text('Generated: '+today(),14,29);doc.text('Income received: '+money(t),14,40);doc.text('Expenses paid: '+money(e),14,48);doc.text('Net cash flow: '+money(t-e),14,56);doc.text('Pending project balances: '+money(db.projects.reduce((a,p)=>a+Math.max(0,p.total-projectReceived(p)),0)),14,64);let y=78;db.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{if(y>280){doc.addPage();y=18}doc.text(`${x.date} ${x.type} ${x.category} ${x.party||''} ${money(x.amount)}`.slice(0,110),14,y);y+=7});doc.save('Andril-Finance-Report.pdf')}
function csvExport(){let rows=[['Date','Type','Category','Party','Amount','Account','Project','Note'],...db.transactions.map(x=>[x.date,x.type,x.category,x.party,x.amount,x.account,x.project,x.note])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\\n');download(new Blob([csv],{type:'text/csv'}),'andril-finance.csv')}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function backup(){download(new Blob([JSON.stringify({version:3,createdAt:new Date().toISOString(),db},null,2)],{type:'application/json'}),'andril-finance-backup.json')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.db||!Array.isArray(x.db.transactions)||!Array.isArray(x.db.projects))throw 0;db=x.db;save();render();alert('Backup restored')}catch{alert('Invalid backup file')}};r.readAsText(f)}
function wipe(){if(confirm('Delete every local transaction, project and rental? Download a backup first.')){db={transactions:[],projects:[],rentals:[]};save();render()}}
function saveCloud(){cfg.url=$('#sbUrl').value.trim();cfg.key=$('#sbKey').value.trim();localStorage.setItem(CFG,JSON.stringify(cfg));initSupabase();alert(supa?'Cloud connection saved.':'Enter a valid Supabase URL and key.')}
function initSupabase(){if(!cfg.url||!cfg.key||!window.supabase)return false;supa=window.supabase.createClient(cfg.url,cfg.key);supa.auth.onAuthStateChange((_event,s)=>{session=s;});return true}
async function googleLogin(){if(!supa){alert('Save your Supabase URL and key first.');return}let {error}=await supa.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(error)alert(error.message)}
async function emailLogin(){if(!supa){alert('Save your Supabase URL and key first.');return}modal('Email sign in',`<form id="authForm"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><div class="actions"><button class="btn gold" name="mode" value="signin">Sign in</button><button class="btn" name="mode" value="signup">Create account</button></div></form>`);$('#authForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),email=f.get('email'),password=f.get('password'),mode=e.submitter?.value||'signin';let res=mode==='signup'?await supa.auth.signUp({email,password}):await supa.auth.signInWithPassword({email,password});if(res.error)alert(res.error.message);else{session=res.data.session;closeModal();await syncNow();render()}}}
async function signOut(){if(supa)await supa.auth.signOut();session=null;alert('Signed out. Local copy remains on this device.');render()}
async function syncNow(){if(!supa||!session)return;let user=session.user.id;for(let table of ['projects','transactions']){let records=db[table]||[];for(let rec of records){let {error}=await supa.from(table).upsert({id:rec.id,user_id:user,data:rec},{onConflict:'user_id,id'});if(error){console.error(error);alert('Sync error: '+error.message);return}}let {data,error}=await supa.from(table).select('data').eq('user_id',user);if(error){alert(error.message);return}let cloud=(data||[]).map(x=>x.data);let map=new Map([...records,...cloud].map(x=>[x.id,x]));db[table]=[...map.values()]};save();alert('Sync complete')}
let syncTimer;function syncSoon(){if(session&&supa){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,800)}}
load();initSupabase();if(supa)supa.auth.getSession().then(({data})=>{session=data.session;render()});render();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
